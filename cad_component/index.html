<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Acrow CAD - Drafting Component</title>
    <!-- مكتبة الرسم الأساسية -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        body { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #1e1e24; 
            color: white; 
            user-select: none; 
        }
        .header { 
            background-color: #2b2b36; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #00bcd4; 
        }
        .workspace { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
        }
        .sidebar { 
            width: 320px; 
            background-color: #25252d; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            overflow-y: auto; 
            border-right: 1px solid #3a3a46; 
            border-left: 1px solid #3a3a46;
        }
        .tool-btn { 
            background-color: #32323e; 
            color: white; 
            border: 1px solid #454555; 
            padding: 10px; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
            transition: 0.2s;
            text-align: center;
        }
        .tool-btn:hover { 
            background-color: #00bcd4; 
            color: black;
        }
        .canvas-container-wrap { 
            flex: 1; 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background-color: #000000;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
            font-size: 13px;
        }
        th, td { 
            border: 1px solid #454555; 
            padding: 6px; 
            text-align: center; 
        }
        th { 
            background: #2b2b36; 
            color: #00bcd4; 
        }
        .table-input { 
            width: 60px; 
            padding: 2px; 
            background: #333; 
            color: #00FFFF; 
            border: 1px solid #555; 
            text-align: center;
            border-radius: 3px;
        }
        .panel {
            border: 1px solid #454555; 
            padding: 10px; 
            border-radius: 6px; 
            background-color: #1e1e24;
            margin-bottom: 10px;
        }
        .panel-title {
            font-size: 13px; 
            color: #00bcd4; 
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="font-size: 16px; color: #00bcd4;">📐 Acrow CAD - Geometry Draft & Auto-Mesh</h1>
        <div>
            <button class="tool-btn" style="background-color: #444; padding: 6px 15px;" onclick="undoAction()">↩ Undo</button>
            <button class="tool-btn" style="background-color: #444; padding: 6px 15px; margin-right: 15px;" onclick="redoAction()">↪ Redo</button>
            <button class="tool-btn" style="background-color: #4CAF50; color: white; padding: 6px 20px; font-size: 14px;" onclick="sendDataToPython()">🔄 Sync Geometry with Python</button>
        </div>
    </div>

    <div class="workspace">
        <!-- Sidebar Left: Drawing & Origin -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">✏️ Draw Geometry</div>
                <button class="tool-btn" style="width: 100%; margin-bottom: 5px;" onclick="drawManualFrame()">Draw Straight Line</button>
                <div style="font-size: 11px; color: #888; margin-top: 5px; text-align: center;">Arcs/Curves are automatically loaded from DXF.</div>
            </div>
            
            <div class="panel">
                <div class="panel-title">📍 Coordinate System</div>
                <button class="tool-btn" style="width: 100%; background: #333;" onclick="enableSetOrigin()">Set Origin (0,0) Point</button>
                <div style="font-size: 12px; color: #ffeb3b; margin-top: 8px; text-align: center;" id="origin_info">Origin: Not Set</div>
            </div>
        </div>

        <!-- The CAD Canvas -->
        <div class="canvas-container-wrap" id="canvas-wrapper">
            <canvas id="designCanvas"></canvas>
        </div>

        <!-- Sidebar Right: Supports & Struts -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">➕ Placement Tools</div>
                <div style="display: flex; gap: 5px;">
                    <button class="tool-btn" style="flex: 1;" onclick="addCustomSupport()">Add Support</button>
                    <button class="tool-btn" style="flex: 1;" onclick="addCustomStrut()">Add Strut</button>
                </div>
            </div>
            
            <div class="panel">
                <div class="panel-title">📏 Supports Tracker</div>
                <div style="max-height: 250px; overflow-y: auto;">
                    <table id="supportTable">
                        <thead>
                            <tr>
                                <th>Sup #</th>
                                <th>X Dist (m)</th>
                            </tr>
                        </thead>
                        <tbody id="supportTrackerBody">
                            <tr>
                                <td colspan="2" style="color:gray;">Set Origin to enable editing</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div style="font-size: 10px; color: #888; margin-top: 5px;">* Distances measured from (0,0) point.</div>
            </div>
            
            <div class="panel">
                <div class="panel-title">ℹ️ Selection Info</div>
                <input type="text" id="prop_id" readonly style="width: 100%; background: #111; color: yellow; border: 1px solid #444; padding: 5px; font-weight: bold; text-align: center;" placeholder="No item selected">
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // 💡 STREAMLIT BULLETPROOF HANDSHAKE
        // =========================================================
        function sendStreamlitMessage(type, data) {
            let messageType = type;
            if (!messageType.startsWith("streamlit:")) {
                messageType = "streamlit:" + type;
            }
            let message = Object.assign({
                isStreamlitMessage: true,
                type: messageType,
            }, data);
            window.parent.postMessage(message, "*");
        }

        function notifyReady() { 
            sendStreamlitMessage("componentReady", { apiVersion: 1 }); 
        }
        
        function setFrameHeight(height) { 
            sendStreamlitMessage("setFrameHeight", { height: height }); 
        }

        notifyReady();
        setFrameHeight(800);
        window.addEventListener("load", function() { notifyReady(); setFrameHeight(800); });
        window.addEventListener("resize", function() { setFrameHeight(800); });
        setInterval(function() { setFrameHeight(800); }, 1000);

        function sendDataToPython() {
            let payload = { 
                cad_lines: cadLines, 
                supports: supportsList, 
                struts: strutsList, 
                status: "ready"
            };
            sendStreamlitMessage("setComponentValue", { value: payload });
        }

        // =========================================================
        // 💡 DXF RECEIVER (Handles Lines & Arcs)
        // =========================================================
        let lastDxfId = null;
        
        window.addEventListener("message", function(event) {
            if (event.data.type === "streamlit:render") {
                let args = event.data.args;
                if (args.initial_dxf && args.initial_dxf.id !== lastDxfId) {
                    lastDxfId = args.initial_dxf.id;
                    loadDxfToCanvas(args.initial_dxf);
                }
            }
        });

        function loadDxfToCanvas(data) {
            canvas.clear();
            cadLines = []; 
            strutsList = []; 
            supportsList = []; 
            originPt = null;
            document.getElementById('origin_info').innerText = "Origin: Not Set";
            document.getElementById('origin_info').style.color = "#ffeb3b";
            
            let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
            
            function ub(x, y) { 
                if(x < minX) minX = x; if(x > maxX) maxX = x; 
                if(y < minY) minY = y; if(y > maxY) maxY = y; 
            }
            
            data.frames.forEach(l => { 
                if(l.type === 'line') {
                    ub(l.x1, l.y1); ub(l.x2, l.y2); 
                } else if(l.type === 'arc') {
                    // Approximate arc bounding box
                    ub(l.c[0] - l.r, l.c[1] - l.r); ub(l.c[0] + l.r, l.c[1] + l.r);
                }
            });
            
            data.struts.forEach(s => { 
                ub(s.p1[0], s.p1[1]); ub(s.p2[0], s.p2[1]); 
            });
            
            data.supports.forEach(s => { ub(s.x, s.y); });
            
            if (minX === Infinity) return; 
            
            let pad = 100;
            let w_ratio = (canvas.width - pad * 2) / (maxX - minX || 1);
            let h_ratio = (canvas.height - pad * 2) / (maxY - minY || 1);
            ppx = Math.min(w_ratio, h_ratio);
            
            function tx(x) { return pad + (x - minX) * ppx; }
            function ty(y) { return canvas.height - pad - (y - minY) * ppx; }

            let fC = 1; let sC = 1; let spC = 1;
            
            data.frames.forEach(l => {
                let id = 'Frame_' + fC++;
                if(l.type === 'line') {
                    cadLines.push({
                        id: id, type: 'line', x1: tx(l.x1), y1: ty(l.y1), x2: tx(l.x2), y2: ty(l.y2), 
                        raw_x1: l.x1, raw_y1: l.y1, raw_x2: l.x2, raw_y2: l.y2
                    });
                    let fLine = new fabric.Line([tx(l.x1), ty(l.y1), tx(l.x2), ty(l.y2)], { 
                        stroke: '#00FFFF', strokeWidth: 3, id: id, lockMovementX: true, lockMovementY: true, hasControls: false 
                    });
                    canvas.add(fLine);
                } else if (l.type === 'arc') {
                    cadLines.push({
                        id: id, type: 'arc', c: [tx(l.c[0]), ty(l.c[1])], r: l.r * ppx, sa: l.sa, ea: l.ea,
                        raw_c: l.c, raw_r: l.r
                    });
                    
                    // Draw arc using fabric.Circle with start/end angles
                    let startAngDeg = -(l.ea * 180 / Math.PI); // Reversed for screen coords
                    let endAngDeg = -(l.sa * 180 / Math.PI);
                    
                    let fArc = new fabric.Circle({
                        radius: l.r * ppx,
                        left: tx(l.c[0]), top: ty(l.c[1]),
                        originX: 'center', originY: 'center',
                        fill: 'transparent',
                        stroke: '#00FFFF', strokeWidth: 3,
                        startAngle: startAngDeg * Math.PI/180,
                        endAngle: endAngDeg * Math.PI/180,
                        id: id, lockMovementX: true, lockMovementY: true, hasControls: false 
                    });
                    canvas.add(fArc);
                }
            });
            
            data.struts.forEach(s => {
                createStrutWithHandles('Strut_' + sC++, tx(s.p1[0]), ty(s.p1[1]), tx(s.p2[0]), ty(s.p2[1]));
            });
            
            data.supports.forEach(s => {
                createSupport('Support_' + spC++, tx(s.x), ty(s.y));
            });
            
            updateSupportTable();
            saveState();
            sendDataToPython(); 
        }

        // =========================================================
        // CORE CAD LOGIC (Drafting & Snapping)
        // =========================================================
        const wrapper = document.getElementById('canvas-wrapper');
        const canvas = new fabric.Canvas('designCanvas', { 
            width: wrapper.clientWidth, height: wrapper.clientHeight, backgroundColor: '#000000', selection: true 
        }); 
        
        window.addEventListener('resize', () => { 
            canvas.setWidth(wrapper.clientWidth); canvas.setHeight(wrapper.clientHeight); canvas.renderAll(); 
        });

        let cadLines = [];
        let strutsList = [];
        let supportsList = [];
        let ppx = 100;
        let originPt = null;
        
        let fC = 1; let sC = 1; let spC = 1;
        let isSettingOrigin = false; let isDrawing = false; let drawLineStart = null; let tempLine = null;
        let undoStack = []; let redoStack = [];

        function saveState() { 
            undoStack.push(JSON.stringify({ cadLines, strutsList, supportsList })); redoStack = []; updateSupportTable(); 
        }
        
        function restoreState(stateStr) {
            let state = JSON.parse(stateStr); 
            cadLines = state.cadLines; strutsList = state.strutsList; supportsList = state.supportsList; 
            canvas.clear();
            
            cadLines.forEach(l => { 
                if(l.type === 'line') {
                    let fLine = new fabric.Line([l.x1, l.y1, l.x2, l.y2], { stroke: '#00FFFF', strokeWidth: 3, id: l.id, lockMovementX: true, lockMovementY: true, hasControls: false }); 
                    canvas.add(fLine); 
                } else if(l.type === 'arc') {
                    let startAngDeg = -(l.ea * 180 / Math.PI);
                    let endAngDeg = -(l.sa * 180 / Math.PI);
                    let fArc = new fabric.Circle({ radius: l.r, left: l.c[0], top: l.c[1], originX: 'center', originY: 'center', fill: 'transparent', stroke: '#00FFFF', strokeWidth: 3, startAngle: startAngDeg * Math.PI/180, endAngle: endAngDeg * Math.PI/180, id: l.id, lockMovementX: true, lockMovementY: true, hasControls: false });
                    canvas.add(fArc);
                }
            });
            
            strutsList.forEach(s => { createStrutWithHandles(s.id, s.top_x, s.top_y, s.gx, s.gy, true); });
            supportsList.forEach(s => { createSupport(s.id, s.x, s.y, true); });
            updateSupportTable();
        }
        
        function undoAction() { if(undoStack.length > 0) { redoStack.push(JSON.stringify({cadLines, strutsList, supportsList})); restoreState(undoStack.pop()); } }
        function redoAction() { if(redoStack.length > 0) { undoStack.push(JSON.stringify({cadLines, strutsList, supportsList})); restoreState(redoStack.pop()); } }

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') { 
                canvas.discardActiveObject(); canvas.renderAll(); isSettingOrigin = false; isDrawing = false; 
                if(tempLine) { canvas.remove(tempLine); } tempLine = null; canvas.defaultCursor = 'default'; document.getElementById('prop_id').value = "";
            }
            if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoAction(); }
            if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redoAction(); }
            if (e.key === 'Delete') {
                let active = canvas.getActiveObjects(); if(active.length === 0) return; 
                saveState();
                active.forEach(obj => {
                    if(obj.id.includes('Frame')) { cadLines = cadLines.filter(l => l.id !== obj.id); } 
                    else if(obj.id.includes('Support')) { supportsList = supportsList.filter(s => s.id !== obj.id); } 
                    else if(obj.id.includes('Strut')) { 
                        let idParts = obj.id.split('_'); let stId = idParts[0] + '_' + idParts[1]; 
                        strutsList = strutsList.filter(s => s.id !== stId); 
                    }
                });
                canvas.remove(...active); canvas.discardActiveObject(); document.getElementById('prop_id').value = ""; updateSupportTable();
            }
        });

        function enableSetOrigin() { isSettingOrigin = true; alert("🎯 Click on frame to set (0,0)"); canvas.defaultCursor = 'crosshair'; }
        function drawManualFrame() { isDrawing = true; alert("✏️ Click to start, click again to end frame."); canvas.defaultCursor = 'crosshair'; }

        canvas.on('mouse:down', function(opt) {
            if (opt.e.button === 1 || opt.e.altKey) { this.isDragging = true; this.lastPosX = opt.e.clientX; this.lastPosY = opt.e.clientY; canvas.defaultCursor = 'grabbing'; return; }
            let p = canvas.getPointer(opt.e);
            
            if(isDrawing) {
                if(!drawLineStart) {
                    drawLineStart = p;
                    tempLine = new fabric.Line([p.x, p.y, p.x, p.y], { stroke: '#00FFFF', strokeWidth: 3, selectable: false });
                    canvas.add(tempLine);
                } else {
                    saveState();
                    let id = 'Frame_' + fC++;
                    cadLines.push({ id: id, type: 'line', x1: drawLineStart.x, y1: drawLineStart.y, x2: p.x, y2: p.y });
                    let fLine = new fabric.Line([drawLineStart.x, drawLineStart.y, p.x, p.y], { stroke: '#00FFFF', strokeWidth: 3, id: id, lockMovementX: true, lockMovementY: true, hasControls: false });
                    canvas.add(fLine); canvas.remove(tempLine); tempLine = null; drawLineStart = null; isDrawing = false; canvas.defaultCursor = 'default';
                }
                return;
            }
            
            if(isSettingOrigin) {
                let snap = getNearestPointOnFrames(p.x, p.y); originPt = {x: snap.x, y: snap.y};
                document.getElementById('origin_info').innerText = `✅ Origin Set Successfully`;
                document.getElementById('origin_info').style.color = "#4CAF50";
                
                let originCircle = new fabric.Circle({ left: snap.x, top: snap.y, radius: 8, fill: 'red', originX: 'center', originY: 'center', selectable: false });
                canvas.add(originCircle);
                isSettingOrigin = false; canvas.defaultCursor = 'default'; updateSupportTable(); return;
            }
        });

        canvas.on('mouse:move', function(opt) { 
            let p = canvas.getPointer(opt.e);
            if(isDrawing && tempLine) { tempLine.set({x2: p.x, y2: p.y}); canvas.renderAll(); }
            if (this.isDragging) { var v = this.viewportTransform; v[4] += opt.e.clientX - this.lastPosX; v[5] += opt.e.clientY - this.lastPosY; this.requestRenderAll(); this.lastPosX = opt.e.clientX; this.lastPosY = opt.e.clientY; } 
        });
        
        canvas.on('mouse:up', function() { this.isDragging = false; if(!isDrawing && !isSettingOrigin) { canvas.defaultCursor = 'default'; } });
        
        canvas.on('mouse:wheel', function(opt) { 
            var z = canvas.getZoom() * (0.999 ** opt.e.deltaY); 
            if(z > 50) z = 50; if(z < 0.01) z = 0.01; 
            canvas.zoomToPoint({x: opt.e.offsetX, y: opt.e.offsetY}, z); opt.e.preventDefault(); opt.e.stopPropagation(); 
        });

        canvas.on('selection:created', handleSelection); canvas.on('selection:updated', handleSelection);
        function handleSelection(e) {
            let active = canvas.getActiveObjects();
            if(active.length === 1) { document.getElementById('prop_id').value = active[0].id; } 
            else if (active.length > 1) { document.getElementById('prop_id').value = `Multiple Selected`; }
        }

        function getNearestPointOnFrames(px, py) {
            let bestDist = Infinity; let bestPoint = {x: px, y: py};
            
            cadLines.forEach(line => {
                if(line.type === 'line') {
                    let dx = line.x2 - line.x1; let dy = line.y2 - line.y1; let len2 = dx * dx + dy * dy; if (len2 === 0) return;
                    let dot = (px - line.x1) * dx + (py - line.y1) * dy;
                    let t = Math.max(0, Math.min(1, dot / len2)); 
                    let projX = line.x1 + t * dx; let projY = line.y1 + t * dy; 
                    let dist = Math.hypot(px - projX, py - projY);
                    if (dist < bestDist) { bestDist = dist; bestPoint = {x: projX, y: projY}; }
                } else if(line.type === 'arc') {
                    let cx = line.c[0]; let cy = line.c[1]; let r = line.r;
                    let ang = Math.atan2(py - cy, px - cx);
                    let projX = cx + r * Math.cos(ang); let projY = cy + r * Math.sin(ang);
                    let dist = Math.hypot(px - projX, py - projY);
                    if (dist < bestDist) { bestDist = dist; bestPoint = {x: projX, y: projY}; }
                }
            });
            return bestPoint;
        }

        function updateSupportTable() {
            let tbody = document.getElementById('supportTrackerBody'); tbody.innerHTML = '';
            if(!originPt) { tbody.innerHTML = `<tr><td colspan="2" style="color:gray;">Set Origin to enable</td></tr>`; return; }
            supportsList.forEach((s, idx) => {
                let relX = ((s.x - originPt.x)/ppx).toFixed(3);
                tbody.innerHTML += `<tr><td>${idx+1}</td><td><input type="number" step="0.1" class="table-input" value="${relX}" onchange="moveSupportFromTable('${s.id}', this.value)"></td></tr>`;
            });
        }
        
        function moveSupportFromTable(id, newRelX) {
            if(!originPt) return; 
            let absX = originPt.x + (parseFloat(newRelX) * ppx); 
            let snap = getNearestPointOnFrames(absX, originPt.y); 
            let s_idx = supportsList.findIndex(s => s.id === id); 
            supportsList[s_idx].x = snap.x; supportsList[s_idx].y = snap.y;
            let fabricObj = canvas.getObjects().find(o => o.id === id); 
            if(fabricObj) { fabricObj.set({left: snap.x, top: snap.y}); canvas.renderAll(); } 
            saveState();
        }

        function addCustomSupport() { 
            saveState(); let c = canvas.getVpCenter(); let snap = getNearestPointOnFrames(c.x, c.y); 
            createSupport('Support_C' + spC++, snap.x, snap.y); updateSupportTable();
        }
        
        function createSupport(id, x, y, isRestore=false) {
            if(!isRestore) supportsList.push({id: id, x: x, y: y});
            let sup = new fabric.Triangle({ left: x, top: y, width: 25, height: 25, fill: '#00FF00', originX: 'center', originY: 'center', angle: 180, id: id, hoverCursor: 'move', hasControls: false });
            sup.on('moving', function(e) { 
                let s = getNearestPointOnFrames(sup.left, sup.top); sup.set({left: s.x, top: s.y}); 
                let idx = supportsList.findIndex(i => i.id === id); if(idx > -1) { supportsList[idx].x = s.x; supportsList[idx].y = s.y; } updateSupportTable();
            });
            canvas.add(sup);
        }

        function addCustomStrut() { 
            saveState(); let c = canvas.getVpCenter(); let snap = getNearestPointOnFrames(c.x, c.y); 
            createStrutWithHandles('Strut_C' + sC++, snap.x, snap.y, snap.x + 100, snap.y + 100); 
        }
        
        function createStrutWithHandles(id, x1, y1, x2, y2, isRestore=false) {
            let line = new fabric.Line([x1, y1, x2, y2], { stroke: '#ff6e40', strokeWidth: 3, strokeDashArray: [5, 5], selectable: false }); canvas.add(line);
            let pTop = new fabric.Circle({ left: x1, top: y1, radius: 10, fill: 'yellow', originX: 'center', originY: 'center', hasControls: false, id: id + '_top' });
            let pBot = new fabric.Circle({ left: x2, top: y2, radius: 10, fill: '#ff6e40', originX: 'center', originY: 'center', hasControls: false, id: id + '_bot' });
            canvas.add(pTop, pBot);
            if(!isRestore) { strutsList.push({ id: id, top_x: x1, top_y: y1, gx: x2, gy: y2, lineRef: line, pTop: pTop, pBot: pBot }); }
            
            [pTop, pBot].forEach(p => {
                p.on('moving', function(e) {
                    let s = getNearestPointOnFrames(p.left, p.top); p.set({left: s.x, top: s.y});
                    if(p.id.includes('_top')) { line.set({x1: s.x, y1: s.y}); } else { line.set({x2: s.x, y2: s.y}); }
                    let idx = strutsList.findIndex(i => i.id === id); 
                    if(idx > -1) { strutsList[idx].top_x = line.x1; strutsList[idx].top_y = line.y1; strutsList[idx].gx = line.x2; strutsList[idx].gy = line.y2; }
                });
            });
        }
    </script>
</body>
</html>
